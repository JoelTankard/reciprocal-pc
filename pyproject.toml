[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reciprocal-pc"
version = "0.1.0"
description = "Focused ReciprocalPC language-model research"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8",
  "torch>=2.2",
  "numpy>=1.26",
  "pyarrow>=15",
  "requests>=2.31",
  "rustbpe>=0.1.0",
  "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]


[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
